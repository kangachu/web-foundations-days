<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <script src="users.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    button {
      padding: 0.6rem 1rem;
      cursor: pointer;
    }
    input {
      padding: 0.5rem;
    }
    #status {
      font-weight: bold;
    }
    #users-list {
      list-style: none;
      padding: 0;
    }
    .user-card {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      background: #fafafa;
    }
    .user-card h3 {
      margin: 0 0 0.25rem 0;
    }
    .user-card p {
      margin: 0.25rem 0;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>User Directory</h1>

  <div class="controls">
    <button id="load-users" type="button">Load Users</button>

    <div>
      <label for="filter-input">Filter by name:</label>
      <input type="text" id="filter-input" placeholder="Type a name to filter...">
    </div>
  </div>

  <p id="status"></p>
  <ul id="users-list"></ul>
</body>
</html>
