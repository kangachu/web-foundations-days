<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Day 4</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>QuickNotes Draft</h1>
      <button id="theme-toggle" type="button">Dark mode</button>
    </header>

    <main>
      <label for="note-text">Write your note:</label>
      <textarea id="note-text" rows="8" placeholder="Type your note here..."></textarea>

      <div class="counter-bar">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <div class="actions">
        <button id="clear-btn" type="button">Clear</button>
      </div>
    </main>
  </div>
</body>
</html>
